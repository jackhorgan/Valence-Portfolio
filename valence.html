<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><title>Valence — Portfolio Tracker</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf4;background:#080b10}*{box-sizing:border-box}body{margin:0;background:#080b10}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:flex}.sidebar{width:250px;background:#0b0f14;border-right:1px solid #1c232c;display:flex;flex-direction:column;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 25px}.mark{width:34px;height:34px;border-radius:10px;background:#e9eff7;color:#0a0e13;display:grid;place-items:center;font-weight:900}.brandname{font-size:13px;letter-spacing:.17em;font-weight:900}.brandtag,.eyebrow{color:#6e7885;font-size:9px;letter-spacing:.16em;font-weight:800}.nav{display:grid;gap:5px}.nav button,.side button{border:0;background:transparent;color:#8d97a5;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13px;cursor:pointer;text-align:left;width:100%}.nav button:hover,.nav button.active,.side button:hover{background:#151b22;color:#f1f5f9}.nav button.active{box-shadow:inset 2px 0 #e5ebf2}.side{margin-top:auto;display:grid;gap:4px}.sync{border:1px solid #1f2832;background:#0f141a;padding:12px;border-radius:12px;color:#9ba7b5;font-size:10px;line-height:1.45}.sync b{display:block;color:#dfe6ee;font-size:11px}.main{margin-left:250px;flex:1;min-width:0}.top{height:68px;border-bottom:1px solid #1a2129;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:rgba(8,11,16,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:#687380}.crumb b{color:#dce3eb}.actions{display:flex;align-items:center;gap:8px}.pill,.icon,.add,.outline,.ghost,.primary{border-radius:9px;border:1px solid #222b35;background:#10161c;color:#b8c2ce}.pill{padding:8px 10px;font-size:11px}.icon{width:36px;height:36px;display:grid;place-items:center;cursor:pointer}.add,.primary{background:#e9eef6;color:#0b0f14;border-color:#e9eef6;font-weight:800;padding:9px 13px;cursor:pointer}.outline{padding:9px 12px;cursor:pointer}.ghost{padding:9px 12px;cursor:pointer}.menu{display:none}.content{padding:30px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.head h1{margin:4px 0 7px;font-size:30px;letter-spacing:-.04em}.head p{margin:0;color:#7d8794;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#0d1218;border:1px solid #1b242d;border-radius:14px}.stat{padding:16px}.stat-top{display:flex;justify-content:space-between;color:#7b8693;font-size:11px}.stat-ico{width:28px;height:28px;border-radius:8px;background:#151c24;display:grid;place-items:center}.stat-value{font-size:24px;font-weight:800;margin-top:14px}.muted{color:#66717e;font-size:10px}.good{color:#9dc1a6}.bad{color:#d99b9b}.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:12px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.panel-head h2{font-size:14px;margin:0 0 4px}.panel-head span{font-size:10px;color:#6f7b88}.range{display:flex;gap:2px;border:1px solid #232c35;background:#131a21;padding:2px;border-radius:8px}.range button{border:0;background:transparent;color:#6f7b88;font-size:9px;padding:6px 8px;border-radius:6px;cursor:pointer}.range .sel{background:#252e38;color:#e7ecf2}.chart{height:290px}.alloc{min-height:290px;display:grid;grid-template-columns:230px 1fr;align-items:center;gap:10px}.donut{width:220px;height:220px;position:relative}.donut svg{width:100%;height:100%;transform:rotate(-90deg)}.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.donut-center b{font-size:28px}.legend{display:grid;gap:12px}.leg{display:grid;grid-template-columns:9px 1fr auto;gap:7px;align-items:center;font-size:11px;color:#9aa5b3}.dot{width:8px;height:8px;border-radius:50%;background:#a9b7c8}.leg b{color:#e1e7ee}.table-panel{margin-top:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px;font-size:11px}th{padding:10px;color:#596572;font-size:9px;text-transform:uppercase;letter-spacing:.11em;text-align:left;border-bottom:1px solid #1d252d}td{padding:13px 10px;color:#aab4c1;border-bottom:1px solid #151c23;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.ticker b{display:block;color:#e1e7ee}.ticker small,td small{display:block;color:#66727f;font-size:9px;margin-top:3px}.bar{width:65px;height:4px;border-radius:9px;background:#1b232b;overflow:hidden;display:inline-block;margin-right:7px}.bar i{display:block;height:100%;background:#aab8c9}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.quick button{background:#0d1218;border:1px solid #1b242d;color:#dfe6ee;border-radius:13px;padding:14px;text-align:left;cursor:pointer}.quick b{display:block}.quick span{font-size:10px;color:#6f7b87;display:block;margin-top:4px}.report-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.kpi{background:#11171e;border:1px solid #1d2630;border-radius:10px;padding:14px}.kpi span{display:block;font-size:9px;color:#697582;text-transform:uppercase;letter-spacing:.08em}.kpi b{display:block;font-size:19px;margin-top:7px}.note{border-top:1px solid #1d252d;padding-top:14px;color:#7a8692;font-size:11px;line-height:1.5}.badge{font-size:9px;font-weight:900;padding:4px 7px;border-radius:20px}.buy{background:#17231c;color:#9dc1a6}.sell{background:#271a1a;color:#d99b9b}.div{background:#1a2028;color:#9facc0}.danger{border:0;background:transparent;color:#6d7886;cursor:pointer}.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.58);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(650px,100%);background:#0d1218;border:1px solid #27313b;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.mhead{display:flex;justify-content:space-between;align-items:center;padding:18px}.mhead h2{font-size:16px;margin:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 18px 18px}.field{display:grid;gap:6px}.field span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#6d7986;font-weight:800}.field.full{grid-column:1/-1}.field input,.field select,.field textarea{background:#0a0f14;color:#dfe6ee;border:1px solid #222c35;border-radius:9px;padding:10px 11px;font-size:12px;outline:none;width:100%}.field textarea{min-height:85px;resize:vertical}.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 18px;border-top:1px solid #1b232b}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.report-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}}@media(max-width:800px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:10}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu{display:grid}.top{padding:0 14px}.pill{display:none}.content{padding:20px 14px}.head{align-items:flex-start;flex-direction:column}.alloc{grid-template-columns:1fr;justify-items:center}.legend{width:100%;grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.stats{grid-template-columns:1fr}.actions .icon{display:none}.head h1{font-size:25px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.outline{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="app"><aside id="sidebar" class="sidebar"><div class="brand"><div class="mark">V</div><div><div class="brandname">VALENCE</div><div class="brandtag">PORTFOLIO OS</div></div></div><div class="nav"><button data-page="dashboard" class="active">▦ <span>Dashboard</span></button><button data-page="holdings">◫ <span>Holdings</span></button><button data-page="transactions">☷ <span>Transactions</span></button><button data-page="reports">◴ <span>Reports</span></button></div><div class="side"><button id="importBtn">⇧ Import backup<input id="fileInput" hidden type="file" accept="application/json"></button><button id="exportBtn">⇩ Export backup</button><button id="resetBtn">↻ Reset demo</button><div class="sync"><b>Local-first</b>Your portfolio is stored in this browser. Export a backup to move it between devices.</div></div></aside><main class="main"><header class="top"><div class="crumb"><button id="menuBtn" class="icon menu">☰</button> Portfolio / <b id="crumbPage">Dashboard</b></div><div class="actions"><span class="pill">Week of Sep 15, 2026</span><button class="icon">◔</button><button id="topAdd" class="add">+ Add</button></div></header><div id="content" class="content"></div></main></div><div id="modalRoot"></div>
<script>
const KEY='valence_single_file_v1';
const demo={currency:'USD',cash:1240,holdings:[{id:'1',ticker:'AAPL',name:'Apple Inc.',type:'Stock',sector:'Technology',shares:15,avgCost:170,price:233.74,dividendYield:.42},{id:'2',ticker:'VOO',name:'Vanguard S&P 500 ETF',type:'ETF',sector:'US Equity',shares:25,avgCost:410,price:621.77,dividendYield:1.18},{id:'3',ticker:'NVDA',name:'NVIDIA Corporation',type:'Stock',sector:'Technology',shares:5,avgCost:118.5,price:182.27,dividendYield:.03},{id:'4',ticker:'BTC',name:'Bitcoin',type:'Crypto',sector:'Crypto',shares:.18,avgCost:72000,price:115000,dividendYield:0}],transactions:[{id:'t1',date:'2026-09-15',type:'Buy',ticker:'NVDA',quantity:5,price:118.5,fee:0,notes:'Weekly DCA contribution'},{id:'t2',date:'2026-09-01',type:'Buy',ticker:'VOO',quantity:1,price:614.12,fee:0,notes:'Monthly index contribution'},{id:'t3',date:'2026-08-29',type:'Div',ticker:'VOO',quantity:0,price:0,fee:12.5,notes:'Quarterly dividend'}],snapshots:[{date:'2026-08-17',value:23800,deposits:0},{date:'2026-08-24',value:24250,deposits:500},{date:'2026-08-31',value:25800,deposits:500},{date:'2026-09-07',value:26900,deposits:0},{date:'2026-09-14',value:28760,deposits:500}]};
let state=load(),page='dashboard';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch{return structuredClone(demo)}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:state.currency,maximumFractionDigits:2}).format(n||0)}
function pct(n){return `${n>=0?'+':''}${(n||0).toFixed(2)}%`}
function positions(){return state.holdings.map(h=>{const v=h.shares*h.price,c=h.shares*h.avgCost;return {...h,value:v,cost:c,pl:v-c,plPct:c?(v-c)/c*100:0}})}
function totals(){const ps=positions(),invested=ps.reduce((a,p)=>a+p.cost,0),value=ps.reduce((a,p)=>a+p.value,0)+state.cash,pl=ps.reduce((a,p)=>a+p.pl,0),income=ps.reduce((a,p)=>a+p.value*(p.dividendYield||0)/100,0);return {ps,invested,value,pl,income,plPct:invested?pl/invested*100:0}}
function svgLine(data,w=720,h=250){if(!data.length)return '<div class="muted" style="padding:30px">Add a weekly snapshot to see portfolio growth.</div>';const vals=data.map(d=>d.value),min=Math.min(...vals),max=Math.max(...vals),pad=24,range=max-min||1;const pts=data.map((d,i)=>{const x=pad+i*(w-2*pad)/Math.max(data.length-1,1),y=h-pad-(d.value-min)/range*(h-2*pad);return `${x},${y}`}).join(' ');const area=`${pad},${h-pad} ${pts} ${w-pad},${h-pad}`;return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${area}" fill="#9cabbc22" stroke="none"/><polyline points="${pts}" fill="none" stroke="#dce5f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${data.map((d,i)=>{const [x,y]=`${pts}`.split(' ')[i].split(',');return `<text x="${x}" y="${h-5}" text-anchor="middle" fill="#596572" font-size="10">${d.date.slice(5)}</text>`}).join('')}</svg>`}
function donutSvg(items){const total=items.reduce((a,x)=>a+x.weight,0)||1;let offset=0;const colors=['#e8eef7','#8295af','#566c89','#bdc9d9','#7b8da4','#64778f'];let arcs='';items.forEach((x,i)=>{const len=x.weight/total*251.2;arcs+=`<circle cx="110" cy="110" r="80" fill="none" stroke="${colors[i%colors.length]}" stroke-width="28" stroke-dasharray="${len} ${251.2-len}" stroke-dashoffset="${-offset}"/>`;offset+=len});return `<svg viewBox="0 0 220 220">${arcs}</svg>`}
function render(){document.getElementById('crumbPage').textContent=page[0].toUpperCase()+page.slice(1);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const c=document.getElementById('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='holdings')c.innerHTML=holdings();if(page==='transactions')c.innerHTML=transactions();if(page==='reports')c.innerHTML=reports()}
function head(kicker,title,sub,btn='+ Add'){return `<div class="head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><button class="outline" onclick="openModal('${btn==='+ Add'?'transaction':'snapshot'}')">${btn}</button></div>`}
function dashboard(){const t=totals(), alloc=t.ps.map(p=>({...p,weight:t.value?p.value/t.value*100:0})).sort((a,b)=>b.weight-a.weight),items=alloc.slice(0,6);return head('LIVE PORTFOLIO','Good evening.','Here’s the latest view of your portfolio.','+ Log update')+`<section class="stats"><div class="stat"><div class="stat-top">Portfolio value <span class="stat-ico">$</span></div><div class="stat-value">${money(t.value)}</div><div class="muted ${t.plPct>=0?'good':'bad'}">${pct(t.plPct)} all-time</div></div><div class="stat"><div class="stat-top">Net invested <span class="stat-ico">◉</span></div><div class="stat-value">${money(t.invested)}</div><div class="muted">${t.ps.length} open positions</div></div><div class="stat"><div class="stat-top">Unrealized P/L <span class="stat-ico">↗</span></div><div class="stat-value ${t.pl>=0?'good':'bad'}">${money(t.pl)}</div><div class="muted ${t.pl>=0?'good':'bad'}">${pct(t.plPct)} return</div></div><div class="stat"><div class="stat-top">Projected dividends <span class="stat-ico">↓</span></div><div class="stat-value">${money(t.income)}</div><div class="muted">annualized</div></div></section><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Portfolio growth</h2><span>Ending value by snapshot</span></div><div class="range"><button class="sel">1M</button><button>3M</button><button>1Y</button></div></div><div class="chart" style="margin-top:12px">${svgLine(state.snapshots)}</div></section><section class="panel"><div class="panel-head"><div><h2>Allocation</h2><span>By position</span></div><button class="outline" onclick="openModal('holding')">+ Position</button></div><div class="alloc"><div class="donut">${donutSvg(items)}<div class="donut-center"><b>${t.ps.length}</b><span class="muted">positions</span></div></div><div class="legend">${items.map((x,i)=>`<div class="leg"><span class="dot" style="opacity:${1-i*.08}"></span><span>${x.ticker}</span><b>${x.weight.toFixed(1)}%</b></div>`).join('')}</div></div></section></div><section class="panel table-panel"><div class="panel-head"><div><h2>Open holdings</h2><span>Current portfolio positions</span></div><button class="outline" onclick="page='holdings';render()">View all →</button></div><div class="scroll"><table><thead><tr><th>Position</th><th>Price</th><th>Value</th><th>P/L</th><th>Weight</th></tr></thead><tbody>${alloc.map(x=>`<tr><td><div class="ticker"><b>${x.ticker}</b><small>${x.name}</small></div></td><td>${money(x.price)}</td><td>${money(x.value)}</td><td class="${x.pl>=0?'good':'bad'}">${money(x.pl)}<small>${pct(x.plPct)}</small></td><td><span class="bar"><i style="width:${Math.min(x.weight,100)}%"></i></span>${x.weight.toFixed(1)}%</td></tr>`).join('')}</tbody></table></div></section><div class="quick"><button onclick="openModal('transaction')"><b>+ Add transaction</b><span>Buy, sell, dividend or cash movement</span></button><button onclick="openModal('holding')"><b>+ Add a position</b><span>Stock, ETF, fund or crypto</span></button><button onclick="openModal('snapshot')"><b>+ Log weekly snapshot</b><span>Capture your end-of-week value</span></button></div>`}
function holdings(){const t=totals();return head('POSITIONS','Open holdings','Everything you currently own in one place.','+ Add position').replace("onclick=\"openModal('transaction')\"","onclick=\"openModal('holding')\"")+`<section class="panel table-panel"><div class="scroll"><table><thead><tr><th>Position</th><th>Shares</th><th>Avg cost</th><th>Current price</th><th>Value</th><th>P/L</th><th>Weight</th><th></th></tr></thead><tbody>${t.ps.map(x=>`<tr><td><div class="ticker"><b>${x.ticker}</b><small>${x.name} · ${x.sector}</small></div></td><td>${x.shares}</td><td>${money(x.avgCost)}</td><td>${money(x.price)}</td><td>${money(x.value)}</td><td class="${x.pl>=0?'good':'bad'}">${money(x.pl)}<small>${pct(x.plPct)}</small></td><td>${t.value?(x.value/t.value*100).toFixed(1):0}%</td><td><button class="danger" onclick="deleteHolding('${x.id}')">✕</button></td></tr>`).join('')}</tbody></table></div></section>`}
function transactions(){return head('JOURNAL','Transactions','Log buys, sells, dividends and cash movements.','+ Add transaction').replace("onclick=\"openModal('snapshot')\"","onclick=\"openModal('transaction')\"")+`<section class="panel table-panel"><div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>Ticker</th><th>Quantity</th><th>Price</th><th>Total</th><th>Notes</th><th></th></tr></thead><tbody>${state.transactions.map(x=>{const total=x.type==='Div'?x.fee:x.quantity*x.price+x.fee;return `<tr><td>${x.date}</td><td><span class="badge ${x.type.toLowerCase()}">${x.type}</span></td><td><b>${x.ticker}</b></td><td>${x.quantity||'—'}</td><td>${x.price?money(x.price):'—'}</td><td>${money(total)}</td><td>${x.notes||'—'}</td><td><button class="danger" onclick="deleteTransaction('${x.id}')">✕</button></td></tr>`}).join('')}</tbody></table></div></section>`}
function reports(){const t=totals();return head('PERFORMANCE','Weekly & monthly reports','Turn your updates into a simple investing record.','+ Log snapshot')+`<div class="report-grid"><section class="panel"><div class="panel-head"><div><h2>Current period</h2><span>Compared with invested capital</span></div></div><div class="kpis"><div class="kpi"><span>Portfolio value</span><b>${money(t.value)}</b></div><div class="kpi"><span>Net invested</span><b>${money(t.invested)}</b></div><div class="kpi"><span>Unrealized P/L</span><b class="${t.pl>=0?'good':'bad'}">${money(t.pl)}</b></div></div><div class="note"><b style="color:#d7dfe8">Investor note</b><div>${t.pl>=0?'Your portfolio is above cost basis. Keep contributions consistent and compare performance with a benchmark.':'Your portfolio is below cost basis. Review position sizing and thesis before reacting to short-term moves.'}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Snapshot trend</h2><span>Weekly/monthly ending values</span></div></div><div class="chart" style="margin-top:12px">${svgLine(state.snapshots)}</div></section></div><section class="panel table-panel"><div class="panel-head"><div><h2>Snapshot history</h2><span>Use this at the end of each week or month</span></div></div><div class="scroll"><table><thead><tr><th>Period</th><th>Ending value</th><th>Deposits</th><th>Change vs prior</th></tr></thead><tbody>${state.snapshots.slice().reverse().map((s,i,arr)=>{const prev=arr[i+1],d=prev?s.value-prev.value:0;return `<tr><td>${s.date}</td><td>${money(s.value)}</td><td>${money(s.deposits||0)}</td><td class="${d>=0?'good':'bad'}">${prev?money(d):'—'}</td></tr>`}).join('')}</tbody></table></div></section>`}
function openModal(type){let html='';if(type==='transaction')html=transactionForm();if(type==='holding')html=holdingForm();if(type==='snapshot')html=snapshotForm();document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="mhead"><h2>${type==='transaction'?'Add transaction':type==='holding'?'Add position':'Log portfolio snapshot'}</h2><button class="icon" onclick="closeModal()">✕</button></div>${html}</div></div>`}
function field(label,html,full=false){return `<label class="field ${full?'full':''}"><span>${label}</span>${html}</label>`}
function transactionForm(){return `<div class="form">${field('Date',`<input id="f-date" type="date" value="${new Date().toISOString().slice(0,10)}">`)}${field('Type',`<select id="f-type"><option>Buy</option><option>Sell</option><option>Div</option></select>`)}${field('Ticker',`<input id="f-ticker" placeholder="NVDA">`)}${field('Quantity',`<input id="f-qty" type="number" step="any">`)}${field('Price per share',`<input id="f-price" type="number" step="any">`)}${field('Fee / dividend amount',`<input id="f-fee" type="number" step="any" placeholder="0">`)}${field('Notes / strategy',`<textarea id="f-notes" placeholder="Weekly DCA contribution"></textarea>`,true)}</div><div class="mfoot"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="addTransaction()">Save transaction</button></div>`}
function holdingForm(){return `<div class="form">${field('Ticker',`<input id="h-ticker" placeholder="MSFT">`)}${field('Company / asset',`<input id="h-name" placeholder="Microsoft">`)}${field('Type',`<select id="h-type"><option>Stock</option><option>ETF</option><option>Crypto</option><option>Fund</option></select>`)}${field('Sector',`<input id="h-sector" placeholder="Technology">`)}${field('Shares / units',`<input id="h-shares" type="number" step="any">`)}${field('Average cost',`<input id="h-cost" type="number" step="any">`)}${field('Current price',`<input id="h-price" type="number" step="any">`)}${field('Dividend yield %',`<input id="h-yield" type="number" step="any" value="0">`)}</div><div class="mfoot"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="addHolding()">Add position</button></div>`}
function snapshotForm(){return `<div class="form">${field('Period end date',`<input id="s-date" type="date" value="${new Date().toISOString().slice(0,10)}">`)}${field('Ending portfolio value',`<input id="s-value" type="number">`)}${field('Net deposits',`<input id="s-deposit" type="number" value="0">`)}</div><div class="mfoot"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="addSnapshot()">Save snapshot</button></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function addTransaction(){const x={id:crypto.randomUUID(),date:val('f-date'),type:val('f-type'),ticker:val('f-ticker').toUpperCase(),quantity:+val('f-qty')||0,price:+val('f-price')||0,fee:+val('f-fee')||0,notes:val('f-notes')};if(!x.ticker)return;state.transactions.unshift(x);save();closeModal();render()}
function addHolding(){const x={id:crypto.randomUUID(),ticker:val('h-ticker').toUpperCase(),name:val('h-name'),type:val('h-type'),sector:val('h-sector'),shares:+val('h-shares')||0,avgCost:+val('h-cost')||0,price:+val('h-price')||0,dividendYield:+val('h-yield')||0};if(!x.ticker)return;state.holdings.push(x);save();closeModal();render()}
function addSnapshot(){const x={date:val('s-date'),value:+val('s-value')||0,deposits:+val('s-deposit')||0};if(!x.value)return;state.snapshots.push(x);state.snapshots.sort((a,b)=>a.date.localeCompare(b.date));save();closeModal();render()}
function val(id){return document.getElementById(id)?.value||''}
function deleteHolding(id){if(confirm('Delete this holding?')){state.holdings=state.holdings.filter(x=>x.id!==id);save();render()}}
function deleteTransaction(id){if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(x=>x.id!==id);save();render()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();document.getElementById('sidebar').classList.remove('open')});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('topAdd').onclick=()=>openModal('transaction');
document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset to demo data?')){state=structuredClone(demo);save();render()}};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='valence-backup.json';a.click()};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert('Backup imported.')}catch{alert('Invalid Valence backup.')}};r.readAsText(f)};
render();
</script></body></html>
